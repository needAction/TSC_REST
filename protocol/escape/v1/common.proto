syntax = "proto3";

package escape.v1;
option csharp_namespace = "EscapeGame.Protocol.V1";

enum SessionErrorCode {
  SESSION_ERROR_CODE_UNSPECIFIED = 0;
  SESSION_FULL = 1;
  SESSION_NOT_FOUND = 2;
  INVALID_PARTICIPANT = 3;
  PARTICIPANT_TOKEN_REQUIRED = 4;
  INVALID_REQUEST = 5;
  UNSUPPORTED_MEDIA_TYPE = 6;
  PAYLOAD_TOO_LARGE = 7;
  ROOM_NOT_FOUND = 8;
  SUBMISSION_NOT_ALLOWED = 9;
  GAME_NOT_PLAYING = 10;
  INTERNAL_ERROR = 11;
  ROUTE_NOT_FOUND = 12;
}

message SessionFailure {
  SessionErrorCode code = 1;
}
